[project]
name = "moacubed"
version = "0.1.0"
description = "Profile evaluation and routing evidence for Hermes MoA."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0",
]
browser = [
  "playwright>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moacubed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
